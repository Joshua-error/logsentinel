name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
      - name: Run detector on sample logs
        run: |
          logsentinel --auth sample_logs/auth.log --firewall sample_logs/ufw.log \
                      --web sample_logs/access.log --year 2026 -o reports
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: sample-report
          path: reports/
